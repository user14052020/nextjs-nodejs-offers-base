services:
  mongo:
    restart: unless-stopped
    image: mongo:6
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--quiet"]
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

  mongo-init-replica:
    image: mongo:6
    restart: "no"
    depends_on:
      mongo:
        condition: service_started
    command:
      [
        "sh",
        "-c",
        "until mongosh --host mongo:27017 --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1; do sleep 1; done; mongosh --host mongo:27017 --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }\""
      ]

  redis:
    restart: unless-stopped
    image: redis:7
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    expose:
      - "9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3201
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/offers-base?replicaSet=rs0}
      - ELASTICSEARCH_NODE=${ELASTICSEARCH_NODE:-http://elasticsearch:9200}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-12h}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    ports:
      - "${API_PORT:-3201}:3201"

  web:
    restart: unless-stopped
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3201}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3201}
    environment:
      - API_INTERNAL_URL=http://api:3201
      - NODE_ENV=production
      - PORT=3200
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3201}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3200}:3200"

volumes:
  mongo_data:
  redis_data:
  es_data:
